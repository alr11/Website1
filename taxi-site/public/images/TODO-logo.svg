    <rect x="110" y="146" width="11" height="8"/><rect x="77" y="154" width="11" height="8"/>
    <rect x="99" y="154" width="11" height="8"/><rect x="121" y="154" width="11" height="8"/>
  </g>
  <text x="100" y="182" fill="url(#goldgrad)" font-family="system-ui, sans-serif" font-size="15" letter-spacing="4" text-anchor="middle">TAXI SERVICE</text>
</svg>
