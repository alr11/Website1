<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="JF Taxi Service logo placeholder">
  <!-- TODO(owner): replace this file with the supplied gold-on-black JF logo
       (export as SVG, or swap to TODO-logo.png and update siteConfig.images.logo). -->
  <defs>
    <linearGradient id="goldgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5ecc9"/>
      <stop offset="45%" stop-color="#d4b13c"/>
      <stop offset="100%" stop-color="#8f7015"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="14" fill="#0b0b0c"/>
  <g fill="url(#goldgrad)" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" text-anchor="middle">
    <text x="100" y="104" letter-spacing="-2">JF</text>
  </g>
