<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Quick Ride Taxis logo">
  <!-- STAND-IN. Drawn from the supplied business card so the site reads correctly
       until the real artwork is uploaded. Replace with the supplied file:
       add it as quickride-logo.png and point siteConfig.images.logo at it. -->
  <rect width="512" height="512" rx="26" fill="#0d1b33"/>

  <!-- Chequered ring: two concentric dashed strokes, phase-offset to read as a chequer. -->
  <g fill="none">
    <circle cx="256" cy="256" r="210" stroke="#ffc20e" stroke-width="24"/>
    <circle cx="256" cy="256" r="210" stroke="#0d1b33" stroke-width="24"
            stroke-dasharray="21.99 21.99" stroke-dashoffset="0"/>
    <circle cx="256" cy="256" r="186" stroke="#ffc20e" stroke-width="24"/>
    <circle cx="256" cy="256" r="186" stroke="#0d1b33" stroke-width="24"
            stroke-dasharray="21.87 21.87" stroke-dashoffset="21.87"/>
  </g>

  <circle cx="256" cy="256" r="168" fill="#0d1b33"/>

  <!-- Taxi, front three-quarter flat view -->
  <g transform="translate(256 268)">
    <!-- roof sign -->
    <rect x="-26" y="-96" width="52" height="26" rx="7" fill="#ffc20e"/>
    <!-- cabin -->
    <path d="M-74-70h148c9 0 16 5 19 13l14 34H-107l14-34c3-8 10-13 19-13Z" fill="#fff"/>
    <!-- windscreen -->
    <path d="M-62-56h124l11 28H-73Z" fill="#0d1b33"/>
    <!-- body -->
    <rect x="-118" y="-24" width="236" height="74" rx="20" fill="#fff"/>
    <!-- grille shadow -->
    <rect x="-58" y="6" width="116" height="20" rx="8" fill="#0d1b33" opacity=".18"/>
    <!-- headlights -->
    <rect x="-108" y="-4" width="40" height="20" rx="8" fill="#0d1b33" opacity=".28"/>
    <rect x="68" y="-4" width="40" height="20" rx="8" fill="#0d1b33" opacity=".28"/>
    <!-- wheels -->
    <rect x="-104" y="44" width="34" height="18" rx="6" fill="#fff"/>
    <rect x="70" y="44" width="34" height="18" rx="6" fill="#fff"/>
  </g>
</svg>
